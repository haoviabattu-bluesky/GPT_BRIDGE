<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cấu hình GPT_BRIDGE Handoff</title>
<style>
  :root { color-scheme: dark; }
  body { max-width: 560px; margin: 32px auto; padding: 0 16px;
         font: 14px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
         background: #0f1115; color: #e6e8ee; }
  h1 { font-size: 17px; margin-bottom: 4px; }
  p.lead { color: #8b93a7; font-size: 13px; margin-top: 0; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; margin-top: 5px; padding: 9px 10px;
          background: #0b0e13; color: #e6e8ee; border: 1px solid #2b303b;
          border-radius: 7px; font: 12.5px ui-monospace, monospace; }
  .hint { font-size: 12px; color: #6f7789; margin-top: 4px; }
  .row { display: flex; gap: 8px; margin-top: 20px; }
  button { padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
           border: 1px solid #2b303b; background: #1a1f29; color: #e6e8ee; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  #msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  #msg.ok { color: #8ce99a; }
  #msg.err { color: #ff7b72; }
  code { background: #1a1f29; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Cấu hình GPT_BRIDGE Handoff</h1>
  <p class="lead">Kết nối extension với Hermes local và chỉ định ĐÚNG cuộc hội thoại ChatGPT.</p>

  <label for="serverUrl">Địa chỉ Hermes local</label>
  <input id="serverUrl" placeholder="http://127.0.0.1:8765">
  <div class="hint">Chạy: <code>python -m chatgpt_web_handoff.server --port 8765</code></div>

  <label for="token">Token</label>
  <input id="token" placeholder="dán token Hermes in ra khi khởi động">
  <div class="hint">Token chỉ lưu trong profile Chrome này, không gửi ra ngoài loopback.</div>

  <label for="conversationUrl">URL cuộc hội thoại ChatGPT (cố định)</label>
  <input id="conversationUrl" placeholder="https://chatgpt.com/c/xxxxxxxx-xxxx-xxxx">
  <div class="hint">Extension chỉ mở đúng URL này. Không bao giờ tự tạo chat mới.</div>

  <div class="row">
    <button id="save" class="primary">Lưu</button>
    <button id="test">Kiểm tra kết nối</button>
  </div>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
